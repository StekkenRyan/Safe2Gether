# Production overlay — used together with docker-compose.yml:
#   docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Each node needs its own .env with:
#   NODE_ID, DATABASE_URL, POSTGRES_PASSWORD, CF_TUNNEL_TOKEN

services:
  api:
    # Replace the dev source-bind-mount entirely; the only volume in prod is
    # the read-only APNs auth key (placed on the host at
    # /etc/safe2gether/apns_key.p8, perms 0600).
    volumes: !override
      - /etc/safe2gether/apns_key.p8:/run/secrets/apns_key.p8:ro
    environment:
      FLASK_DEBUG: "0"
      ENV: prod
      # Background workers run in the dedicated `worker` service below, not in
      # the web workers (avoids duplicate timer escalations + eventlet hazards).
      RUN_WORKERS: "0"
    # gthread (not eventlet): the app is a plain blocking WSGI service with a
    # blocking psycopg2 driver — threads are the safe match. APNs fan-out is
    # already offloaded to background threads inside the request.
    command: gunicorn -w 2 --threads 4 -k gthread -b 0.0.0.0:5000 --access-logfile - wsgi:app
    ports: !reset []  # cloudflared handles all ingress; no direct port exposure
    restart: always

  # Dedicated single-process worker: escalation queue + Dead-Man's-Switch timer.
  worker:
    build: .
    env_file:
      - .env
    environment:
      FLASK_APP: app
      FLASK_DEBUG: "0"
      ENV: prod
      TZ: Europe/Berlin
    volumes:
      - /etc/safe2gether/apns_key.p8:/run/secrets/apns_key.p8:ro
    command: python -m app.worker
    depends_on:
      - redis
      - postgres
    restart: always

  redis:
    ports: !reset []  # not exposed externally; only reachable inside docker network
    restart: always

  postgres:
    ports: !reset []  # not exposed externally; Flask connects via docker network
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
    restart: always
    depends_on:
      - api
