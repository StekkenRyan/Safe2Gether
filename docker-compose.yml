services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      FLASK_APP: app
      FLASK_DEBUG: "1"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://safe2gether:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/safe2gether
      NODE_ID: ${NODE_ID:-dev-node}
    env_file:
      - .env
    volumes:
      - .:/app
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: safe2gether
      POSTGRES_USER: safe2gether
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U safe2gether"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
