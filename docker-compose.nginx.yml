# Nginx reverse proxy overlay (HTTP only — Cloudflare Tunnel handles TLS).
#
# Usage:
#   docker compose -f docker-compose.yml \
#                  -f docker-compose.prod.yml \
#                  -f docker-compose.nginx.yml up -d
#
# Cloudflare Tunnel → Public Hostnames:
#   safe2gether.de      → http://nginx:80
#   api.safe2gether.de  → http://nginx:80
#
# SSL mode in Cloudflare dashboard: Full (not strict)
# The tunnel itself encrypts the Cloudflare ↔ Pi connection;
# no certificate is needed on the origin side.

services:
  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/safe2gether.conf:/etc/nginx/conf.d/safe2gether.conf:ro
    # no ports — cloudflared handles all ingress
    restart: always
    depends_on:
      - api
