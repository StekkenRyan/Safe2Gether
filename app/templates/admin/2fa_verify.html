{% extends "base.html" %}

{% block title %}2FA — Safe2Gether Admin{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl
                  bg-teal-500/10 border border-teal-500/25 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-slate-100">Zwei-Faktor-Authentifizierung</h1>
      <p class="text-sm text-slate-500 mt-1">Code aus deiner Authenticator-App eingeben</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/25 text-red-400 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/2fa/verify" class="space-y-4">
      <div>
        <label for="code" class="block text-xs font-medium text-slate-400 mb-1.5">
          6-stelliger Code
        </label>
        <input
          id="code" name="code" type="text" inputmode="numeric" pattern="\d{6}"
          maxlength="6" required autocomplete="one-time-code" autofocus
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800/60 border border-slate-700
                 text-slate-100 placeholder-slate-500 text-sm tracking-[0.3em] text-center
                 focus:outline-none focus:border-teal-500/60 focus:ring-1 focus:ring-teal-500/30
                 transition-colors"
          placeholder="000000"
        >
      </div>
      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-teal-500/15 border border-teal-500/30
               text-teal-300 font-medium text-sm hover:bg-teal-500/25 hover:border-teal-500/50
               transition-colors focus:outline-none focus:ring-2 focus:ring-teal-500/40 mt-2"
      >
        Bestätigen
      </button>
    </form>

    <p class="text-center text-xs text-slate-600 mt-8">
      <a href="/admin/login" class="hover:text-slate-400 transition-colors">← Zurück zum Login</a>
    </p>
  </div>
</div>
{% endblock %}
