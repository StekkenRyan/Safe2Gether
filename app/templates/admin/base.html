{% extends "base.html" %}

{% block body %}
<div class="min-h-screen flex flex-col">

  <header class="border-b border-slate-800 px-6 py-3 flex items-center justify-between flex-shrink-0">
    <div class="flex items-center gap-4">
      <span class="text-teal-400 font-semibold text-sm tracking-wide">Safe2Gether</span>
      <nav class="flex items-center gap-1">
        <a href="/admin/"
           class="px-2.5 py-1 rounded text-xs transition-colors
                  {{ 'text-slate-100 bg-slate-700/60' if active_nav == 'dashboard' else 'text-slate-500 hover:text-slate-300' }}">
          Dashboard
        </a>
        <a href="/admin/users"
           class="px-2.5 py-1 rounded text-xs transition-colors
                  {{ 'text-slate-100 bg-slate-700/60' if active_nav == 'users' else 'text-slate-500 hover:text-slate-300' }}">
          Nutzer
        </a>
        <a href="/admin/2fa/setup"
           class="px-2.5 py-1 rounded text-xs transition-colors
                  {{ 'text-slate-100 bg-slate-700/60' if active_nav == '2fa' else 'text-slate-500 hover:text-slate-300' }}">
          2FA
        </a>
      </nav>
    </div>
    <div class="flex items-center gap-3">
      <span class="px-2 py-0.5 rounded text-xs font-mono font-semibold
        {{ 'bg-amber-500/20 text-amber-400 border border-amber-500/30' if env == 'dev'
           else 'bg-teal-500/20 text-teal-400 border border-teal-500/30' }}">
        {{ env_cfg.label }}
      </span>
      <a href="{{ env_cfg.link }}"
         class="text-xs text-slate-600 hover:text-slate-400 transition-colors"
         title="Zu {{ env_cfg.link_label }} wechseln">
        {{ env_cfg.link_label }}
      </a>
      <span class="text-slate-700">·</span>
      <a href="/admin/logout" class="text-xs text-slate-600 hover:text-slate-400 transition-colors">
        Abmelden
      </a>
    </div>
  </header>

  {% block admin_content %}{% endblock %}

  <footer class="border-t border-slate-800 px-6 py-3 text-center text-xs text-slate-700 mt-auto">
    Safe2Gether Admin
  </footer>
</div>
{% endblock %}
