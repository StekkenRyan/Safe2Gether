{% extends "base.html" %}

{% block title %}Admin Login — Safe2Gether{% endblock %}

{% block body %}
<div class="min-h-screen flex items-center justify-center px-4">
  <div class="w-full max-w-sm">

    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl
                  bg-teal-500/10 border border-teal-500/25 mb-4">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-teal-400"
             viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1 class="text-xl font-semibold text-slate-100">Admin</h1>
      <p class="text-sm text-slate-500 mt-1">Safe2Gether Dashboard</p>
    </div>

    {% if error %}
    <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/25 text-red-400 text-sm">
      {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/admin/login" class="space-y-4">
      <div>
        <label for="username" class="block text-xs font-medium text-slate-400 mb-1.5">
          Benutzername
        </label>
        <input
          id="username" name="username" type="text" required autocomplete="username"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800/60 border border-slate-700
                 text-slate-100 placeholder-slate-500 text-sm
                 focus:outline-none focus:border-teal-500/60 focus:ring-1 focus:ring-teal-500/30
                 transition-colors"
          placeholder="admin"
        >
      </div>
      <div>
        <label for="password" class="block text-xs font-medium text-slate-400 mb-1.5">
          Passwort
        </label>
        <input
          id="password" name="password" type="password" required autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg bg-slate-800/60 border border-slate-700
                 text-slate-100 placeholder-slate-500 text-sm
                 focus:outline-none focus:border-teal-500/60 focus:ring-1 focus:ring-teal-500/30
                 transition-colors"
          placeholder="••••••••"
        >
      </div>
      <button
        type="submit"
        class="w-full py-2.5 px-4 rounded-lg bg-teal-500/15 border border-teal-500/30
               text-teal-300 font-medium text-sm hover:bg-teal-500/25 hover:border-teal-500/50
               transition-colors focus:outline-none focus:ring-2 focus:ring-teal-500/40 mt-2"
      >
        Anmelden
      </button>
    </form>

    <p class="text-center text-xs text-slate-600 mt-8">
      <a href="/" class="hover:text-slate-400 transition-colors">← Zurück zur Startseite</a>
    </p>
  </div>
</div>
{% endblock %}
